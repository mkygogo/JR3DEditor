server {
    listen 80;
    server_name test.shjrinfo.com;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name test.shjrinfo.com;

    ssl_certificate /etc/nginx/ssl/test.shjrinfo.com_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/test.shjrinfo.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 1024m;
    client_body_timeout 600s;
    send_timeout 600s;

    location = / {
        return 302 /editor/scenes;
    }

    location /api/ {
        proxy_pass http://backend:6001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://backend:6001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /editor/ {
        alias /usr/share/nginx/html/editor/;
        try_files $uri $uri/ /editor/index.html;
    }

    location /asset/ {
        alias /usr/share/nginx/html/asset/;
        try_files $uri $uri/ /asset/index.html;
    }

    location /portal/ {
        alias /usr/share/nginx/html/portal/;
        try_files $uri $uri/ /portal/index.html;
    }
}
